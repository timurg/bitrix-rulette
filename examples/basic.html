          radial-gradient(circle at top, rgba(245, 158, 11, 0.2), transparent 30%),
          linear-gradient(180deg, #f8fafc 0%, #dbeafe 100%);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .demo-shell {
        width: min(1200px, 100%);
      }
    </style>
  </head>

      ProznaniePrizeWheel.createPrizeWheel({
        target: "#lead-wheel",
        theme: currentTheme,
        texts: currentTexts,
        prizes: currentPrizes,
        rules: currentRules,
        yandexMetrika: {
          counterId: 12345678,
          goals: {
            view: "wheel_view",
            agreementCheck: "wheel_agreement_check",
            phoneInputStart: "wheel_phone_input_start",
            spinStart: "wheel_spin_start",
            claim: "wheel_claim"
          }
        },
        onLead: function (payload) {
          return $.ajax({
            url: "./php/bitrix-lead-handler.php",
            method: "POST",
            contentType: "application/json",
            dataType: "json",
            data: JSON.stringify(payload)
          }).done(function (response) {
            console.log("Bitrix response", response);
          });
        }

  </body>
